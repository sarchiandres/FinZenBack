spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finzenback
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update # Cambiar a 'validate' en producción
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
    open-in-view: false

# Configuración de JWT
app:
  jwtSecret: jwtSecret:K7gH8mP0vC9dT5rX2bQ1zU6nM4pS3eL0fW8yD2tR5aV7bG1kQ9hX6cJ4mN5yE3pB
  jwtExpirationMs: 3600000 # 1 hora

